name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: NOAHSALA1929
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=ff6a00&color_dots=#161b22,#30363d,#484f58,#8b949e,#c9d1d9

      - name: Deploy snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}